rules:
  - id: no-eval
    patterns:
      - pattern: eval(...)
    message: "Avoid eval() — dynamic code execution is risky."
    severity: ERROR

  - id: child-process-exec
    patterns:
      - pattern: child_process.exec(...)
    message: "Avoid child_process.exec; prefer spawn with sanitized inputs."
    severity: WARNING

  - id: large-generated-block
    patterns:
      - pattern-regex: '/\\* GENERATED BY AI START \\*/(.|\\n){200,}/\\* GENERATED BY AI END \\*/'
    message: "Large AI-generated block detected; require human review."
    severity: WARNING
